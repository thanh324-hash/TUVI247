name: Build and publish TUVI247
on:
  push:
    branches: [main]
    paths: ['app/**','lib/ziwei/**','package.json','tsconfig.json','next.config.js','.github/workflows/publish-pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tuvi247-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Publish static files to Pages root
        run: |
          cp -R out/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish updated TUVI247 static site"
            git push
          fi