name: Validate TUVI247
on:
  push:
    branches: [integrate-ziwei-engine-vietnamese]
    paths: ['app/**','lib/ziwei/**','package.json','tsconfig.json','next.config.js']
  pull_request:
    branches: [main]
    paths: ['app/**','lib/ziwei/**','package.json','tsconfig.json','next.config.js']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:regression
      - run: npm run build
