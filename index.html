<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tử Vi Đẩu Số 247 - Lập Lá Số & Luận Giải Chuyên Sâu 12 Cung</title>
  <!-- Nhúng Thư viện Lõi Tử Vi iztro (Đầy đủ an sao, vận hạn) -->
  <script src="iztro.min.js"></script>
  <!-- Nhúng Bộ Dữ Liệu & Phân Tích Chuẩn UTF-8 -->
  <script src="tuvi_data.js"></script>
  <script src="analyzer_full.js"></script>
  <style>
    :root {
      --primary: #8b1d1d;
      --primary-dark: #66101f;
      --primary-light: #b33939;
      --gold: #d4af37;
      --gold-dark: #aa820a;
      --bg: #f5f2eb;
      --card-bg: #ffffff;
      --text: #2d2a26;
      --border: #dfd6c5;
      --shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
    }
    .container {
      max-width: 1240px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px 10px;
      background: linear-gradient(135deg, #420a10, #731320);
      color: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--gold);
    }
    .header h1 {
      color: var(--gold);
      font-size: 2.2rem;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .header p {
      font-size: 1.05rem;
      color: #f7e6b5;
    }
    .input-card {
      background: var(--card-bg);
      padding: 22px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      align-items: flex-end;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    .form-group input, .form-group select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #faf8f5;
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 29, 29, 0.15);
    }
    .btn-submit {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      font-weight: bold;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.05rem;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(139, 29, 29, 0.25);
      height: 46px;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      transform: translateY(-2px);
    }
    .result-section {
      display: none;
    }
    .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 15px;
    }
    .btn-action {
      background: #27ae60;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: 0.2s;
    }
    .btn-action:hover {
      opacity: 0.9;
    }
    .overview-banner {
      background: linear-gradient(135deg, #30050a, #5c0f1b);
      color: #fff;
      padding: 20px 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--gold);
    }
    .overview-banner h2 {
      color: var(--gold);
      font-size: 1.35rem;
      margin-bottom: 12px;
      border-bottom: 1px dashed rgba(212, 175, 55, 0.4);
      padding-bottom: 6px;
    }
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
      font-size: 0.98rem;
    }
    .overview-item span {
      color: var(--gold);
      font-weight: 700;
    }
    .horoscope-card {
      background: #fdfaf2;
      border: 1px solid var(--gold);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .horoscope-card h3 {
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .horoscope-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .h-tag {
      background: #fff;
      border: 1px solid #e0cd9b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    .h-tag b {
      color: var(--primary);
    }

    /* KHUNG BIỂU ĐỒ 12 CUNG */
    .chart-container {
      margin-bottom: 30px;
      width: 100%;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      background: #dcd3c1;
      padding: 8px;
      border-radius: 12px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .palace-cell {
      background: #fff;
      border: 1px solid #d5c8b2;
      border-radius: 6px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
      transition: all 0.25s ease;
      min-height: 140px;
    }
    .palace-cell:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(139, 29, 29, 0.2);
      border-color: var(--primary);
    }
    .palace-cell:active {
      transform: scale(0.97);
    }
    .palace-title {
      font-weight: bold;
      color: var(--primary);
      font-size: 0.95rem;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .palace-branch {
      font-size: 0.8rem;
      color: var(--gold-dark);
      font-weight: 600;
    }
    .major-stars {
      color: #961b1b;
      font-weight: bold;
      font-size: 0.85rem;
      margin: 4px 0;
      line-height: 1.25;
    }
    .minor-stars {
      color: #333;
      font-size: 0.75rem;
      margin-top: 2px;
      line-height: 1.25;
    }
    .tag-bright {
      font-size: 0.7rem;
      color: #27ae60;
      font-weight: normal;
    }
    .tag-mutagen {
      background: #e67e22;
      color: #fff;
      padding: 1px 3px;
      border-radius: 3px;
      font-size: 0.68rem;
      margin-left: 2px;
      white-space: nowrap;
    }
    .center-info {
      grid-column: 2 / span 2;
      grid-row: 2 / span 2;
      background: linear-gradient(145deg, #fbf9f4, #f5efe1);
      border: 2px solid var(--gold);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px 8px;
      text-align: center;
      box-shadow: inset 0 0 12px rgba(212, 175, 55, 0.15);
    }
    .center-info h3 {
      color: var(--primary);
      font-size: 1.3rem;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .reading-card {
      background: #fff;
      border-radius: 12px;
      padding: 22px 26px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .reading-card h3 {
      color: var(--primary);
      border-left: 5px solid var(--gold);
      padding-left: 12px;
      font-size: 1.25rem;
      margin-bottom: 12px;
    }
    .reading-content {
      line-height: 1.8;
      font-size: 0.98rem;
    }
    .star-item {
      margin-bottom: 8px;
      padding-left: 6px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 24px 0;
      border-top: 1px solid var(--border);
    }
    .btn-facebook-admin {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #1877f2, #0d65d9);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(24, 119, 242, 0.35);
      transition: all 0.3s ease;
    }
    .btn-facebook-admin:hover {
      background: linear-gradient(135deg, #0d65d9, #094eb0);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(24, 119, 242, 0.45);
      color: #ffffff;
    }
    .btn-facebook-admin svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* ĐẶC BIỆT TỐI ƯU HÓA CHO MÀN HÌNH ĐIỆN THOẠI (KHÔNG CẦN CUỘN NGANG) */
    @media (max-width: 600px) {
      body {
        padding: 8px 6px;
      }
      .container {
        padding: 0;
      }
      .header h1 {
        font-size: 1.5rem;
      }
      .input-card {
        padding: 14px 10px;
      }
      .overview-banner {
        padding: 14px 12px;
      }
      .chart-grid {
        gap: 3px;
        padding: 4px;
        border-radius: 8px;
        min-height: auto;
      }
      .palace-cell {
        padding: 4px 3px;
        min-height: 108px;
        border-radius: 5px;
      }
      .palace-title {
        font-size: 0.72rem;
        padding-bottom: 2px;
      }
      .palace-branch {
        font-size: 0.65rem;
      }
      .major-stars {
        font-size: 0.68rem;
        margin: 2px 0;
        line-height: 1.15;
      }
      .minor-stars {
        font-size: 0.6rem;
        line-height: 1.15;
      }
      .tag-bright {
        font-size: 0.58rem;
      }
      .tag-mutagen {
        font-size: 0.55rem;
        padding: 0 2px;
      }
      .center-info {
        padding: 6px 3px;
        border-radius: 6px;
      }
      .center-info h3 {
        font-size: 0.95rem;
        margin-bottom: 2px;
      }
      .center-info p {
        font-size: 0.65rem !important;
        margin-top: 2px !important;
        line-height: 1.2;
      }
      .reading-card {
        padding: 14px 12px;
      }
      .reading-card h3 {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Tử Vi Đẩu Số 247</h1>
    <p>Hệ Thống An Sao Chuẩn Xác & Luận Giải Chi Tiết 12 Cung Số</p>
  </div>

  <div class="input-card">
    <form id="tuvi-form">
      <div class="input-grid">
        <div class="form-group">
          <label>Họ và Tên</label>
          <input type="text" id="fullname" placeholder="Nguyễn Văn A" value="Đương Số" required>
        </div>
        <div class="form-group">
          <label>Giới Tính</label>
          <select id="gender">
            <option value="male">Nam (Dương Nam / Âm Nam)</option>
            <option value="female">Nữ (Dương Nữ / Âm Nữ)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ngày Sinh Dương Lịch</label>
          <input type="date" id="birthdate" value="2000-01-26" required>
        </div>
        <div class="form-group">
          <label>Giờ Sinh (Theo Can Chi)</label>
          <select id="birthhour">
            <option value="0">Tý Sớm (23:00 - 00:59)</option>
            <option value="1">Sửu (01:00 - 02:59)</option>
            <option value="2">Dần (03:00 - 04:59)</option>
            <option value="3">Mão (05:00 - 06:59)</option>
            <option value="4">Thìn (07:00 - 08:59)</option>
            <option value="5">Tỵ (09:00 - 10:59)</option>
            <option value="6" selected>Ngọ (11:00 - 12:59)</option>
            <option value="7">Mùi (13:00 - 14:59)</option>
            <option value="8">Thân (15:00 - 16:59)</option>
            <option value="9">Dậu (17:00 - 18:59)</option>
            <option value="10">Tuất (19:00 - 20:59)</option>
            <option value="11">Hợi (21:00 - 22:59)</option>
            <option value="12">Tý Muộn (23:00 - 23:59)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Năm Xem Vận Hạn</label>
          <input type="number" id="targetYear" value="2026" min="1900" max="2100">
        </div>
        <div>
          <button type="submit" class="btn-submit" style="width: 100%;">LẬP LÁ SỐ & LUẬN GIẢI</button>
        </div>
      </div>
    </form>
  </div>

  <div id="result-section" class="result-section">
    <div class="action-bar">
      <button class="btn-action" onclick="window.print()">In Lá Số / Xuất PDF</button>
    </div>

    <!-- TỔNG QUAN BẢN MỆNH & BÁT TỰ -->
    <div class="overview-banner">
      <h2>THÔNG TIN BẢN MỆNH & BÁT TỰ</h2>
      <div class="overview-grid" id="overview-content"></div>
    </div>

    <!-- VẬN HẠN NĂM ĐƯỢC CHỌN -->
    <div class="horoscope-card" id="horoscope-box"></div>

    <!-- SƠ ĐỒ 12 CUNG ĐỊA BÀN (TỰ CO GIÃN VỪA KHÍT MÀN HÌNH ĐIỆN THOẠI) -->
    <h2 style="color: var(--primary); font-size: 1.35rem; margin-bottom: 12px;">BẢNG MỆNH BÀN 12 CUNG ĐỊA BÀN</h2>
    <div class="chart-container">
      <div class="chart-grid" id="chart-grid"></div>
    </div>

    <!-- LUẬN GIẢI CHI TIẾT TỪNG CUNG -->
    <h2 style="color: var(--primary); margin-bottom: 14px; font-size: 1.35rem;">LUẬN GIẢI CHI TIẾT 12 CUNG SỐ</h2>
    <div id="detailed-readings"></div>
  </div>

  <footer>
    <a href="https://www.facebook.com/hoangthanhk.myiu/" target="_blank" rel="noopener noreferrer" class="btn-facebook-admin">
      <svg viewBox="0 0 24 24">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
      <span>Liên hệ Admin Facebook</span>
    </a>
  </footer>
</div>

<script>
  // Tọa độ chuẩn 12 cung Tử Vi trên lưới 4x4
  const PALACE_LAYOUT_MAP = {
    "Tỵ": { row: 1, col: 1 },
    "Ngọ": { row: 1, col: 2 },
    "Mùi": { row: 1, col: 3 },
    "Thân": { row: 1, col: 4 },
    "Thìn": { row: 2, col: 1 },
    "Dậu": { row: 2, col: 4 },
    "Mão": { row: 3, col: 1 },
    "Tuất": { row: 3, col: 4 },
    "Dần": { row: 4, col: 1 },
    "Sửu": { row: 4, col: 2 },
    "Tý": { row: 4, col: 3 },
    "Hợi": { row: 4, col: 4 }
  };

  document.getElementById('tuvi-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const fullname = document.getElementById('fullname').value || "Đương Số";
    const gender = document.getElementById('gender').value;
    const birthdate = document.getElementById('birthdate').value;
    const birthhour = parseInt(document.getElementById('birthhour').value);
    const targetYear = parseInt(document.getElementById('targetYear').value) || 2026;

    try {
      // 1. Gọi trực tiếp thư viện iztro ngay trên trình duyệt
      const astrolabe = iztro.astro.bySolar(birthdate, birthhour, gender, true, 'vi-VN');
      // 2. Phân tích chi tiết toàn diện
      const data = analyzeAstrolabeFull(astrolabe, targetYear);
      renderResult(data, fullname);
    } catch (err) {
      alert("Lỗi khi an sao lá số: " + err.message);
      console.error(err);
    }
  });

  function renderResult(data, fullname) {
    document.getElementById('result-section').style.display = 'block';
    const ov = data.overview;
    const hs = data.horoscope;
    const th = data.threeHarmonies;

    // 1. Render Tổng quan
    document.getElementById('overview-content').innerHTML = `
      <div class="overview-item"><span>Họ tên:</span> ${fullname} (${ov.gender})</div>
      <div class="overview-item"><span>Dương lịch:</span> ${ov.solarDate} (${ov.time})</div>
      <div class="overview-item"><span>Âm lịch:</span> ${ov.lunarDate}</div>
      <div class="overview-item"><span>Bát tự Can Chi:</span> ${ov.chineseDate}</div>
      <div class="overview-item"><span>Cục Mệnh:</span> ${ov.fiveElementsClass}</div>
      <div class="overview-item"><span>Mệnh cư:</span> ${ov.earthlyBranchOfSoulPalace} | <span>Thân cư:</span> ${ov.earthlyBranchOfBodyPalace}</div>
      <div class="overview-item"><span>Mệnh chủ:</span> ${ov.soul}</div>
      <div class="overview-item"><span>Thân chủ:</span> ${ov.body}</div>
      <div class="overview-item"><span>Chòm sao:</span> ${ov.sign} - Tuổi ${ov.zodiac}</div>
    `;

    // 2. Render Vận Hạn & Tam Hợp
    let hHtml = `
      <h3>VẬN HẠN NĂM ${hs.targetYear} & THẾ TAM HỢP CUNG MỆNH</h3>
      <div style="font-size:0.95rem; margin-bottom: 8px;">
        Năm xem: <b>${hs.targetYear}</b> | Tuổi mụ (hư tuế): <b>${hs.nominalAge || '--'} tuổi</b> | Tiểu hạn cư: <b>Cung ${hs.agePalaceBranch}</b>
      </div>
      <div class="horoscope-tags">
        <div class="h-tag">Lưu Niên: <b>${hs.yearlyName}</b></div>
        <div class="h-tag">Đại Hạn Hiện Tại: <b>${hs.decadalName}</b></div>
        <div class="h-tag">Tam Hợp Mệnh: <b>${th.target} - ${th.career} - ${th.wealth}</b></div>
        <div class="h-tag">Xung Chiếu: <b>${th.opposite}</b></div>
      </div>
    `;
    if (hs.yearlyMutagens && hs.yearlyMutagens.length > 0) {
      hHtml += `<div style="margin-top: 10px; font-size: 0.9rem; color: #666;">
        <b>Tứ Hóa Lưu Niên:</b> Hóa Lộc (${hs.yearlyMutagens[0] || '—'}), Hóa Quyền (${hs.yearlyMutagens[1] || '—'}), Hóa Khoa (${hs.yearlyMutagens[2] || '—'}), Hóa Kỵ (${hs.yearlyMutagens[3] || '—'})
      </div>`;
    }
    document.getElementById('horoscope-box').innerHTML = hHtml;

    // 3. Render 12 Cung Bàn Cờ
    const grid = document.getElementById('chart-grid');
    grid.innerHTML = `
      <div class="center-info">
        <h3>${fullname}</h3>
        <p style="font-size: 0.95rem; color: #555;"><b>${ov.chineseDate}</b></p>
        <p style="color: var(--primary); font-weight: bold; margin-top: 6px;">${ov.fiveElementsClass}</p>
        <p style="font-size: 0.85rem; margin-top: 6px;">Mệnh chủ: <b>${ov.soul}</b> | Thân chủ: <b>${ov.body}</b></p>
        <p style="font-size: 0.8rem; color: #777; margin-top: 4px;">Tam Hợp: ${th.target} - ${th.wealth} - ${th.career}</p>
      </div>
    `;

    data.palaces.forEach(palace => {
      const pos = PALACE_LAYOUT_MAP[palace.branch] || { row: 1, col: 1 };
      const cell = document.createElement('div');
      cell.className = 'palace-cell';
      cell.style.gridRow = pos.row;
      cell.style.gridColumn = pos.col;

      let majorHtml = '';
      if (palace.majorStars && palace.majorStars.length > 0) {
        majorHtml = palace.majorStars.map(s => {
          let b = s.brightness ? `<span class="tag-bright">(${s.brightness})</span>` : '';
          let m = s.mutagen ? `<span class="tag-mutagen">Hóa ${s.mutagen}</span>` : '';
          return `<div>• ${s.name} ${b} ${m}</div>`;
        }).join('');
      } else {
        majorHtml = `<div style="color: #999; font-style: italic;">(Vô Chính Diệu)</div>`;
      }

      let minorHtml = '';
      if (palace.minorStars && palace.minorStars.length > 0) {
        minorHtml = palace.minorStars.slice(0, 6).map(s => s.name).join(', ');
        if (palace.minorStars.length > 6) minorHtml += '...';
      }

      let bodyBadge = palace.isBodyPalace ? `<span style="background:#8b1d1d;color:#fff;font-size:0.7rem;padding:1px 5px;border-radius:4px;margin-left:4px;">Thân</span>` : '';

      cell.innerHTML = `
        <div class="palace-title">
          <span>${palace.name} ${bodyBadge}</span>
          <span class="palace-branch">${palace.stem} ${palace.branch}</span>
        </div>
        <div class="major-stars">${majorHtml}</div>
        <div class="minor-stars">${minorHtml}</div>
        <div style="margin-top: auto; font-size: 0.75rem; color: #777; display: flex; justify-content: space-between; padding-top: 4px; border-top: 1px dashed #eee;">
          <span>Đại hạn: ${palace.decadal ? palace.decadal.range[0] + '-' + palace.decadal.range[1] : ''}</span>
          <span>${palace.changsheng12 || ''}</span>
        </div>
      `;

      cell.addEventListener('click', () => {
        const el = document.getElementById('palace-reading-' + palace.branch);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      });

      grid.appendChild(cell);
    });

    // 4. Render Luận giải chi tiết 12 cung
    const readingsDiv = document.getElementById('detailed-readings');
    readingsDiv.innerHTML = '';

    data.palaces.forEach(palace => {
      const card = document.createElement('div');
      card.className = 'reading-card';
      card.id = 'palace-reading-' + palace.branch;

      let majorsContent = '';
      if (palace.majorExplanations && palace.majorExplanations.length > 0) {
        majorsContent = `
          <div style="margin-top: 12px;">
            <b style="color: var(--primary); font-size: 1.05rem;">Chính Tinh Tọa Thủ & Luận Giải Chi Tiết:</b>
            <div style="margin-top: 8px;">
              ${palace.majorExplanations.map(m => `<div class="star-item">${m}</div>`).join('')}
            </div>
          </div>
        `;
      } else {
        majorsContent = `
          <div style="margin-top: 12px; color: #555; background: #faf8f5; padding: 10px 14px; border-radius: 6px;">
            <b>Cung Vô Chính Diệu:</b> Cung vị không có chính tinh trực chiếu, tính cách và hoàn cảnh biến hóa đa dạng, dễ bị ảnh hưởng bởi môi trường xung quanh và cung xung chiếu đối diện. Đương số cần tự lập và rèn luyện năng lực ứng biến linh hoạt.
          </div>
        `;
      }

      let minorsContent = '';
      if (palace.minorExplanations && palace.minorExplanations.length > 0) {
        minorsContent = `
          <div style="margin-top: 14px;">
            <b style="color: var(--gold-dark); font-size: 1rem;">Phụ Tinh, Trợ Tinh & Sát Tinh Tác Động:</b>
            <div style="margin-top: 8px; font-size: 0.95rem;">
              ${palace.minorExplanations.map(m => `<div class="star-item">${m}</div>`).join('')}
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <h3>CUNG ${palace.name.toUpperCase()} (Tọa tại ${palace.stem} ${palace.branch}) ${palace.isBodyPalace ? '— CUNG THÂN' : ''}</h3>
        <div class="reading-content">
          <p style="font-style: italic; color: #666; margin-bottom: 8px;"><b>Ý nghĩa cung vị:</b> ${palace.meaning}</p>
          <p><b>Tổng quan:</b> ${palace.summary}</p>
          ${majorsContent}
          ${minorsContent}
        </div>
      `;
      readingsDiv.appendChild(card);
    });

    document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
